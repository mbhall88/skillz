name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meeting-transcribe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/meeting-transcribe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
